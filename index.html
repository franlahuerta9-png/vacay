<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vacay — Tu viaje, a tu manera</title>
<style>
:root{--cream:#f5f1e8;--paper:#fffdf8;--ink:#17352d;--muted:#6d756e;--line:#d9d6cc;--sage:#dce6dc;--accent:#9caf9b}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}
button{font:inherit;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:28px 28px 70px}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.logo{font-size:27px;font-weight:800;letter-spacing:-1px}.navright{display:flex;gap:12px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;color:var(--ink)}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;letter-spacing:-1.5px} h1{font-size:clamp(48px,8vw,92px);line-height:.94;margin:0 0 24px}
.hero{max-width:900px;margin:50px 0 70px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:18px}
.lead{font-size:20px;line-height:1.55;max-width:680px;color:#53605a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:145px;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px #17352d12}
.card button,.dest{width:100%;height:100%;border:0;background:none;text-align:left;color:inherit}.country-name{font-family:Georgia,serif;font-size:26px}.count{color:var(--muted);font-size:13px;margin-top:8px}
.back{margin-bottom:30px}.back button{border:0;background:none;color:var(--muted);padding:0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:25px 0}.section-head h2{font-size:40px;margin:0}
.destcard{min-height:125px}.destname{font-family:Georgia,serif;font-size:24px}.tag{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:var(--sage);font-size:11px}
.destination-hero{padding:46px;border-radius:30px;background:var(--ink);color:#f9f6ee;margin-bottom:25px}.destination-hero h1{font-size:clamp(48px,7vw,78px);margin-bottom:10px}.destination-hero p{max-width:620px;color:#dce5df;font-size:18px;line-height:1.5}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px;margin:18px 0}.panel h2{font-size:34px;margin:0 0 20px}.moods,.chips{display:flex;flex-wrap:wrap;gap:9px}.choice{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 15px;color:var(--ink)}.choice.active{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}
.primary{border:0;background:var(--ink);color:#fff;padding:15px 22px;border-radius:999px;font-weight:700}.wide{width:100%;margin-top:22px}
.expgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.exp{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.exp small{color:var(--muted);text-transform:uppercase;letter-spacing:1px}.exp h3{font-size:24px;margin:8px 0}.exp p{color:#66716b;line-height:1.5;margin:0}
.itinerary{display:grid;gap:14px}.day{border:1px solid var(--line);border-radius:22px;padding:24px;background:var(--paper)}.daytop{display:flex;justify-content:space-between;align-items:center}.day h3{font-size:29px;margin:0}.save{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px}.slot{display:grid;grid-template-columns:80px 1fr;gap:18px;padding:17px 0;border-top:1px solid var(--line)}.slot:first-of-type{margin-top:18px}.time{font-weight:700}.slot h4{margin:0 0 5px;font-size:17px}.slot p{margin:0;color:var(--muted);line-height:1.4}
.notice{background:var(--sage);padding:16px 18px;border-radius:16px;color:#355044;margin-top:16px}.empty{padding:40px 0;color:var(--muted)}
@media(max-width:760px){.wrap{padding:20px 16px 50px}.fields{grid-template-columns:1fr 1fr}.expgrid{grid-template-columns:1fr}.destination-hero{padding:28px}.navright{display:none}.section-head{align-items:start;flex-direction:column}}

.route-step{display:grid;grid-template-columns:82px 1fr;gap:16px;padding:17px 0;border-top:1px solid var(--line)}.route-step:first-child{border-top:0}.route-time{font-weight:800}.route-main h4{margin:0 0 5px;font-size:18px}.route-main p{margin:0;color:var(--muted);line-height:1.45}.transfer{font-size:12px;color:#53605a;background:var(--sage);display:inline-block;border-radius:999px;padding:5px 9px;margin:7px 0}.route-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}.route-controls label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}.route-controls input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}.locate{margin-top:14px;background:var(--sage);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 15px}.nowcard{display:none;margin-top:16px;padding:18px;border-radius:18px;background:var(--ink);color:#fff}.nowcard.show{display:block}.nowcard p{color:#dce5df;line-height:1.45}.fallback-map{height:100%;min-height:590px;background:#dfeff2;position:relative;overflow:hidden}.fallback-map svg{width:100%;height:100%;display:block}.fallback-pin{cursor:pointer}.map-note{position:absolute;bottom:18px;left:18px;right:18px;background:#fffdf8e8;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px}
@media(max-width:760px){.route-controls{grid-template-columns:1fr}.route-step{grid-template-columns:70px 1fr}}

.searchbox{display:flex;gap:10px;margin-top:18px}.searchbox input{flex:1;padding:15px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px;color:var(--ink)}.searchbox button{border:0;background:var(--ink);color:white;border-radius:999px;padding:0 20px;font-weight:700}
.search-results{margin-top:12px;display:grid;gap:8px}.search-result{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.search-result small{color:var(--muted)}
.restriction{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff4df;border:1px solid #ead9b5;font-size:12px;line-height:1.45;color:#654d22}.restriction b{color:#4c391a}
.badge-verified{background:var(--sage);border-radius:999px;padding:5px 8px;font-size:10px}.badge-pending{background:#eeeae0;border-radius:999px;padding:5px 8px;font-size:10px}

<style>
.maphero{display:grid;grid-template-columns:40% 60%;min-height:650px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -28px 65px;background:var(--cream);overflow:hidden}.mapcopy{padding:78px 52px 70px;display:flex;flex-direction:column;justify-content:center}.mapcopy h1{font-size:clamp(54px,6.6vw,86px);line-height:.92}.mapbox{min-height:650px;position:relative;padding:28px 28px 28px 0;display:flex;align-items:center}.europe-map-frame{position:relative;width:100%;aspect-ratio:960/830;border-radius:34px;overflow:hidden;background:#d8edf0;box-shadow:0 22px 55px rgba(23,53,45,.14);border:1px solid rgba(23,53,45,.08)}.europe-map-image{display:block;width:100%;height:100%;object-fit:contain}.maplabel{position:absolute;z-index:20;top:48px;left:24px;background:#fffdf8ee;border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:12px;box-shadow:0 8px 24px rgba(23,53,45,.08)}.map-pin-link{position:absolute;z-index:30;transform:translate(-50%,-50%);display:block;width:24px;height:24px;border:0;background:transparent;border-radius:50%;padding:0}.map-pin-link::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 4px 12px rgba(23,53,45,.24);transition:transform .18s ease,box-shadow .18s ease}.map-pin-link::after{content:'';position:absolute;inset:0;border:1px solid rgba(23,53,45,.25);border-radius:50%;opacity:.7}.map-pin-link:hover::before,.map-pin-link:focus-visible::before{transform:scale(1.18);box-shadow:0 7px 18px rgba(23,53,45,.28)}.map-pin-link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.map-note{position:absolute;left:24px;bottom:22px;z-index:20;background:#fffdf8ee;border:1px solid var(--line);border-radius:16px;padding:11px 14px;font-size:11px;color:var(--muted);box-shadow:0 8px 22px rgba(23,53,45,.08)}.placegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.placecard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.placecard .type{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.placecard h3{font-size:25px;margin:8px 0}.placecard p{color:#66716b;line-height:1.45;margin:0 0 13px}.meta{display:flex;flex-wrap:wrap;gap:7px}.meta span{background:var(--sage);border-radius:999px;padding:6px 9px;font-size:11px}@media(max-width:850px){.maphero{grid-template-columns:1fr;margin:0 -16px 45px;min-height:0}.mapcopy{padding:45px 24px 30px}.mapbox{padding:0 16px 24px;min-height:0}.europe-map-frame{aspect-ratio:960/830;border-radius:24px}.maplabel{top:18px;left:18px}.map-note{left:18px;bottom:14px}.map-pin-link{width:20px;height:20px}.placegrid{grid-template-columns:1fr}}
.profile-kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}.profile-subtitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:24px 0 10px}.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field input,.plan-note{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink)}.plan-note{min-height:88px;resize:vertical;font:inherit}.profile-result{display:flex;justify-content:space-between;gap:20px;align-items:start}.profile-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.profile-chips span,.route-tag{background:var(--sage);border-radius:999px;padding:7px 10px;font-size:11px}.nearby-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.nearby-actions a{text-decoration:none;display:inline-flex;align-items:center}.nearby-actions .locate{margin-top:0}@media(max-width:850px){.time-grid{grid-template-columns:1fr 1fr}.profile-result{flex-direction:column}.profile-chips{justify-content:flex-start}}@media(max-width:520px){.time-grid{grid-template-columns:1fr}}</style></head>

<script>
const COUNTRIES = {"España": ["Madrid", "Barcelona", "Sevilla", "Granada", "San Sebastián", "Mallorca", "Ibiza", "Tenerife"], "Portugal": ["Lisboa", "Oporto", "Sintra", "Algarve", "Madeira", "Azores"], "Francia": ["París", "Niza", "Provenza", "Lyon", "Burdeos", "Estrasburgo", "Córcega"], "Italia": ["Roma", "Venecia", "Florencia", "Positano", "Capri", "Milán", "Lago di Como", "Cinque Terre", "Puglia", "Sicilia", "Cerdeña", "Dolomitas"], "Grecia": ["Atenas", "Santorini", "Mykonos", "Creta", "Corfú", "Rodas", "Milos"], "Reino Unido": ["Londres", "Edimburgo", "Bath", "York", "Cotswolds", "Isla de Skye"], "Irlanda": ["Dublín", "Galway", "Cork", "Killarney", "Acantilados de Moher"], "Islandia": ["Reikiavik", "Círculo Dorado", "Costa Sur", "Vík", "Akureyri"], "Noruega": ["Oslo", "Bergen", "Geiranger", "Lofoten", "Tromsø"], "Suecia": ["Estocolmo", "Gotemburgo", "Malmö", "Laponia sueca"], "Finlandia": ["Helsinki", "Rovaniemi", "Laponia", "Turku"], "Dinamarca": ["Copenhague", "Aarhus", "Odense"], "Países Bajos": ["Ámsterdam", "Róterdam", "Utrecht", "La Haya", "Giethoorn"], "Bélgica": ["Bruselas", "Brujas", "Gante", "Amberes"], "Luxemburgo": ["Luxemburgo", "Vianden"], "Alemania": ["Berlín", "Múnich", "Hamburgo", "Colonia", "Dresde", "Selva Negra"], "Suiza": ["Zúrich", "Lucerna", "Interlaken", "Zermatt", "Berna", "Lauterbrunnen"], "Austria": ["Viena", "Salzburgo", "Innsbruck", "Hallstatt"], "Chequia": ["Praga", "Český Krumlov", "Brno"], "Polonia": ["Cracovia", "Varsovia", "Gdansk", "Wroclaw", "Zakopane"], "Hungría": ["Budapest", "Lago Balaton"], "Eslovaquia": ["Bratislava", "Altos Tatras"], "Eslovenia": ["Liubliana", "Lago Bled", "Piran", "Valle del Soča"], "Croacia": ["Dubrovnik", "Split", "Hvar", "Zadar", "Rovinj", "Plitvice"], "Montenegro": ["Kotor", "Budva", "Durmitor"], "Serbia": ["Belgrado", "Novi Sad"], "Rumanía": ["Bucarest", "Brașov", "Sibiu", "Transilvania"], "Bulgaria": ["Sofía", "Plovdiv", "Nessebar", "Rila"], "Albania": ["Tirana", "Berat", "Gjirokastër", "Riviera Albanesa"], "Bosnia y Herzegovina": ["Sarajevo", "Mostar"], "Macedonia del Norte": ["Skopie", "Ohrid"], "Estonia": ["Tallin", "Tartu", "Saaremaa"], "Letonia": ["Riga", "Jūrmala"], "Lituania": ["Vilna", "Kaunas", "Curonian Spit"], "Malta": ["La Valeta", "Mdina", "Gozo", "Comino"], "Chipre": ["Nicosia", "Pafos", "Limassol", "Ayia Napa"], "Mónaco": ["Montecarlo", "Monaco-Ville"], "San Marino": ["San Marino"], "Turquía": ["Estambul", "Capadocia", "Antalya", "Éfeso", "Bodrum"], "Ucrania": ["Kyiv", "Leópolis", "Odesa"], "Andorra": ["Andorra la Vella", "Grandvalira"], "Liechtenstein": ["Vaduz", "Malbun"]};
const SPECIAL = {"Positano": [["Paseo por el centro y vistas", "09:30", "Explora las callejuelas, miradores y rincones del centro."], ["Almuerzo italiano", "13:30", "Una pausa gastronómica para probar cocina local."], ["Playa y costa", "17:00", "Tarde para disfrutar del paisaje costero y el ambiente del destino."], ["Atardecer + cena", "20:30", "Cierra el día con vistas y una cena tranquila."]], "Roma": [["Centro histórico", "09:30", "Plazas, fuentes y grandes monumentos en un paseo compacto."], ["Pasta italiana", "13:30", "Comida local en el centro."], ["Barrio con ambiente", "17:00", "Tarde de paseo y cafés."], ["Cena romana", "20:30", "Cena y paseo nocturno."]], "París": [["Barrio emblemático", "09:30", "Paseo por una zona con arquitectura y ambiente."], ["Bistró francés", "13:30", "Comida francesa."], ["Museo o paseo", "17:00", "Tarde cultural o relajada."], ["Cena + luces", "20:30", "París al anochecer."]], "Barcelona": [["Casco histórico", "09:30", "Paseo por calles y plazas emblemáticas."], ["Tapas", "13:30", "Comida local."], ["Arquitectura y mar", "17:00", "Combina cultura y costa."], ["Cena mediterránea", "20:30", "Cena y paseo nocturno."]]};
const moods=["Romántico","Playa","Gastronomía","Aventura","Sin prisas","Cultura"];
const interests=["Playa","Barco","Gastronomía","Cultura","Naturaleza","Atardecer"];
let state={country:null,destination:null,mood:"Sin prisas",days:3,pace:"Equilibrado",company:"Pareja",budget:"Medio",needs:"Sin restricciones",interests:["Gastronomía","Atardecer"],startTime:"09:00",endTime:"21:30",lunchTime:"14:00",dinnerTime:"20:30",planNote:""};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function shell(content){
document.getElementById("app").innerHTML=`<div class="wrap"><nav><div class="logo">vacay</div><div class="navright"><button class="pill" onclick="home()">Europa</button><button class="pill" onclick="showSaved()">Mi viaje <span id="savedCount"></span></button></div></nav>${content}</div>`;
updateCount();
}
function updateCount(){let x=JSON.parse(localStorage.getItem("vacaySaved")||"[]");let e=document.getElementById("savedCount");if(e)e.textContent=x.length?`(${x.length})`:""}
const MAP_PINS = [
  [14.1,17.3,"Reikiavik","Islandia"],[47.9,32.7,"Oslo","Noruega"],[58.9,36.1,"Estocolmo","Suecia"],[70.3,31.3,"Helsinki","Finlandia"],[50.3,42.7,"Copenhague","Dinamarca"],[20.5,45.9,"Dublín","Irlanda"],[30.7,51.8,"Londres","Reino Unido"],[42.2,54.1,"Ámsterdam","Países Bajos"],[54.6,56.5,"Berlín","Alemania"],[66.7,56.5,"Varsovia","Polonia"],[32.6,62.7,"París","Francia"],[54.0,62.4,"Praga","Chequia"],[43.5,68.8,"Zúrich","Suiza"],[59.0,66.9,"Viena","Austria"],[66.0,69.3,"Budapest","Hungría"],[45.8,74.2,"Milán","Italia"],[16.0,81.2,"Madrid","España"],[29.2,81.2,"Barcelona","España"],[7.2,81.2,"Lisboa","Portugal"],[51.7,82.7,"Roma","Italia"],[81.9,83.9,"Estambul","Turquía"],[71.1,91.8,"Atenas","Grecia"]].map(([x,y,name,country])=>`<button class="map-pin-link" style="left:${x}%;top:${y}%" title="${esc(name)}" aria-label="Explorar ${esc(name)}" onclick='country(${JSON.stringify(country)})'></button>`).join("");
function home(){
let cards=Object.entries(COUNTRIES).map(([c,d])=>`<div class="card"><button onclick='country(${JSON.stringify(c)})'><div class="country-name">${esc(c)}</div><div class="count">${d.length} destinos · toca para explorar</div></button></div>`).join("");
shell(`<section class="maphero"><div class="mapcopy"><div class="eyebrow">Tu próximo destino te espera</div><h1>Europa,<br>a tu manera.</h1><p class="lead">Elige un destino y empieza a construir tu viaje. vacay irá afinando las recomendaciones contigo.</p><button class="primary" onclick="document.getElementById('countries').scrollIntoView({behavior:'smooth'})">◉ Explora el mapa <span aria-hidden="true">→</span></button><div style="margin-top:42px;font-family:cursive;font-size:28px;line-height:1.05;color:#31564a;transform:rotate(-3deg)">Good places<br>good people ♡</div></div><div class="mapbox"><div class="europe-map-frame"><img class="europe-map-image" src="mapa-europa.png" alt="Mapa ilustrado de Europa con destinos vacay"><div class="maplabel">Explora Europa</div>${MAP_PINS}<div class="map-note">Pulsa un punto para empezar a construir tu viaje.</div></div></div></section><div class="panel"><h2>Una base de datos para cada destino</h2><p class="lead" style="font-size:16px">Cada ciudad tiene su propia ficha de lugares: restaurantes, cafés, playas, cultura, naturaleza, actividades y transporte. vacay utiliza esa base para construir rutas personalizadas.</p></div><div id="countries"><div class="section-head"><h2>Elige un país</h2><span class="eyebrow">${Object.keys(COUNTRIES).length} países · ${Object.values(COUNTRIES).flat().length} destinos</span></div><div class="grid">${cards}</div></div>`);
}
function countryForMap(name){
const mapCountry={"Madrid":"España","Barcelona":"España","Oporto":"Portugal","París":"Francia","Roma":"Italia","Positano":"Italia","Atenas":"Grecia","Estocolmo":"Suecia","Londres":"Reino Unido","Estambul":"Turquía"};
if(name==="Positano") destination("Italia","Positano"); else country(mapCountry[name]||"Italia");
}
function country(c){
state.country=c;
let cards=COUNTRIES[c].map(d=>`<div class="card destcard"><button class="dest" onclick='destination(${JSON.stringify(c)},${JSON.stringify(d)})'><div class="destname">${esc(d)}</div><span class="tag">Construye tu viaje</span></button></div>`).join("");
shell(`<div class="back"><button onclick="home()">← Volver a Europa</button></div><section class="hero" style="margin-top:10px"><div class="eyebrow">Explora ${esc(c)}</div><h1>${esc(c)}<br>a tu manera.</h1><p class="lead">Selecciona un destino. Todos siguen el mismo flujo completo de vacay: perfil de viaje → experiencias → itinerario.</p></section><div class="section-head"><h2>Destinos</h2></div><div class="grid">${cards}</div>`);
}
const PLACES={"Positano":[
{name:"Da Vincenzo Positano",type:"Restaurante · italiano",price:"€€",why:"Buena opción para una comida italiana completa y céntrica.",tag:"Comida"},

{name:"Roman Archeological Museum (MAR)",type:"Cultura",price:"€",why:"Para introducir una experiencia cultural en medio del recorrido.",tag:"Cultura"},
{name:"Church of Saint Mary of the Assumption",type:"Patrimonio",price:"Consultar",why:"Uno de los puntos icónicos del centro histórico.",tag:"Cultura"},
{name:"Luxury Boats Positano",type:"Barco · excursión",price:"Consultar",why:"Para convertir una tarde en una experiencia de costa y mar.",tag:"Barco"},
{name:"Boat Experience Positano",type:"Barco · excursión",price:"Consultar",why:"Alternativa para descubrir la costa desde el mar.",tag:"Barco"},

function destination(c,d){
state={...state,country:c,destination:d,mood:"Sin prisas",days:3,pace:"Equilibrado",company:"Pareja",budget:"Medio",needs:"Sin restricciones",interests:["Gastronomía","Atardecer"]};
renderDestination();
}
function renderDestination(){
let d=state.destination;
let exps=SPECIAL[d]||[
["Descubrir el destino","09:30","Empieza con un paseo por los lugares más representativos y deja espacio para descubrir rincones."],

];
let moodButtons=moods.map(m=>`<button class="choice ${state.mood===m?"active":""}" onclick='state.mood=${JSON.stringify(m)};renderDestination()'>${m}</button>`).join("");

let expHTML=exps.map(e=>`<article class="exp"><small>${e[1]}</small><h3>${esc(e[0])}</h3><p>${esc(e[2])}</p></article>`).join("");
shell(`<div class="back"><button onclick='country(${JSON.stringify(state.country)})'>← Volver a ${esc(state.country)}</button></div>

<div style="margin-top:24px"><div class="eyebrow">Intereses</div><div class="chips">${intButtons}</div></div>
<div style="margin-top:24px"><div class="eyebrow">Necesidades y preferencias prácticas</div>${select("","needs",["Sin restricciones","Pocas escaleras","Minimizar desplazamientos"],state.needs)}</div>
<div style="margin-top:18px"><label style="display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px">Algo que vacay debería tener en cuenta</label><textarea id="planNote" class="plan-note" placeholder="Ej.: no quiero madrugar, me encanta parar a tomar café, prefiero evitar zonas demasiado turísticas..." oninput="state.planNote=this.value">${esc(state.planNote)}</textarea></div>
<button class="primary wide" onclick="buildItinerary()">Crear mi itinerario a medida ✦</button></div>
<div class="panel"><h2>Sitios concretos que encajan contigo</h2><p class="lead" style="font-size:16px">Aquí vacay deja de darte ideas genéricas: lugares reales que puedes añadir a tu viaje.</p><div id="placeGrid" class="placegrid"></div></div><div id="routeBuilder"></div><div class="panel"><h2>Dónde comer de verdad</h2><div class="notice"><b>Fase 2 activa:</b> fichas comerciales reales incorporadas en destinos prioritarios; cada ficha conserva su fuente y fecha de comprobación.</div><p class="lead" style="font-size:16px">Vacay puede seleccionar restaurantes y cafés según presupuesto, estilo y momento del día. Las fichas comerciales deben refrescarse porque horarios y disponibilidad cambian.</p><div id="foodGrid" class="placegrid"></div></div><div class="panel"><h2>Experiencias para ti</h2><p class="lead" style="font-size:16px">Una selección inicial que se adapta al perfil que acabas de definir.</p><div class="expgrid">${expHTML}</div></div>
<div id="route"></div>`);
let places=getPlaces(state.destination);
let pg=document.getElementById("placeGrid");
let foods=VACAY_BUSINESSES[state.destination]||[];
let fg=document.getElementById("foodGrid");
if(fg) fg.innerHTML=foods.length?foods.map(f=>`<article class="placecard"><div class="type">${esc(f.type)}</div><h3>${esc(f.name)}</h3><p>${esc(f.address)}</p><div class="meta"><span>${esc(f.price)}</span><span>★ ${f.rating}</span><span>${f.reviews.toLocaleString("es-ES")} reseñas</span></div><p style="margin-top:10px;font-size:12px">${esc(f.hours)}</p><button class="save" onclick='addFoodToPlan(${JSON.stringify(f.name)})'>Añadir al viaje</button></article>`).join(""):`<div class="empty">La base comercial de este destino está pendiente de refrescar.</div>`;
if(pg) pg.innerHTML=places.length?places.map((p,i)=>`<article class="placecard"><div class="type">${esc(p.type)}</div><h3>${esc(p.name)}</h3><p>${esc(p.why)}</p><div class="meta"><span>${esc(p.price)}</span><span>${esc(p.tag)}</span><button class="save" onclick='addPlaceToPlan(${i})'>Añadir</button></div></article>`).join(""):`<div class="empty">Estamos incorporando lugares concretos de este destino.</div>`;
const routePanel=document.getElementById("routeBuilder");
if(routePanel) routePanel.innerHTML=`
<div class="panel"><h2>Tu día, paso a paso</h2>
<p class="lead" style="font-size:16px">Aquí puedes reajustar el día sobre la marcha. La salida, la comida, la cena y la hora límite parten de tu perfil vacay.</p>
<div class="route-controls">
<div><label>Hora de salida</label><input id="routeStartTime" type="time" value="${state.startTime}" onchange="state.startTime=this.value"></div>
<button class="primary" onclick="buildDetailedRoute()">Recalcular mi día ✦</button>
</div>
<button class="locate" onclick="findNextFromLocation()">⌖ Estoy aquí · dime qué tengo cerca</button>
<div id="nowCard" class="nowcard"></div>
<div id="detailedRoute"></div></div>`;

}

const DETAILED_ROUTES={
"Positano":[
{name:"Piazza dei Mulini",type:"Inicio · paseo",duration:35,visit:"Empieza aquí y baja por Via dei Mulini hacia el centro.",lat:40.6297,lon:14.4845},
{name:"Church of Santa Maria Assunta",type:"Punto de interés",duration:30,visit:"Parada para ver la cúpula y el corazón histórico de Positano.",lat:40.6294,lon:14.4858},
{name:"Roman Archaeological Museum (MAR)",type:"Cultura",duration:45,visit:"Visita la villa romana bajo la iglesia.",lat:40.6296,lon:14.4857},
{name:"Spiaggia Grande",type:"Playa · paseo",duration:75,visit:"Baja hasta la playa principal y reserva tiempo para disfrutar del frente marítimo.",lat:40.6285,lon:14.4865},
{name:"Cafe Positano",type:"Almuerzo · restaurante",duration:75,visit:"Pausa para comer y recuperar energía.",lat:40.6299,lon:14.4869},
{name:"Fornillo Beach",type:"Playa · tarde",duration:90,visit:"Continúa por el Lovers' Path y pasa la tarde junto al mar.",lat:40.6265,lon:14.4808},
{name:"Ocean Bar",type:"Aperitivo",duration:45,visit:"Parada para tomar algo antes de volver hacia el centro.",lat:40.6281,lon:14.4860},
{name:"Ristorante Don Giovanni",type:"Cena",duration:100,visit:"Cena italiana para cerrar el día.",lat:40.6313,lon:14.4857}
]};
function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function hh(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function searchVacay(){
let q=(document.getElementById("vacaySearch")?.value||"").toLowerCase().trim();
let box=document.getElementById("searchResults");if(!box)return;
if(!q){box.innerHTML="";return}
let places=getPlaces(state.destination);
let foods=VACAY_BUSINESSES[state.destination]||[];
let all=[...places.map(p=>({...p,kind:"Lugar"})),...foods.map(p=>({...p,kind:"Comer"}))];
let terms=q.split(/\s+/).filter(Boolean);
let results=all.map(p=>{
let text=(p.name+" "+p.type+" "+(p.description||"")+" "+(p.why||"")+" "+(p.tag||"")).toLowerCase();
let score=terms.reduce((s,t)=>s+(text.includes(t)?2:0),0); if(/cerca|cercano|cerca del|por aquí|aquí/.test(q)&&p.name) score+=1;
if(/comer|comida|restaurante|almorzar|cenar|cena|desayuno|café|cafe|pizza|pasta/.test(q)&&/restaurante|café|cafetería|comida|pizza|pastelería/.test((p.type||"").toLowerCase()))score+=5;
if(/playa|mar|baño/.test(q)&&/playa|barco/.test((p.type||"").toLowerCase()))score+=5;
if(/iglesia|iglesias|templo|catedral|basílica|basilica/.test(q)&&/cultura|patrimonio|basílica|iglesia|monumento/.test((p.type||"").toLowerCase()))score+=5;
return {...p,score};
}).filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
box.innerHTML=results.length?results.map((p,i)=>`<div class="search-result"><div><b>${esc(p.name)}</b><br><small>${esc(p.kind)} · ${esc(p.type||"")}</small>${VACAY_RESTRICTIONS[p.name]?`<div class="restriction"><b>⚠️</b> ${VACAY_RESTRICTIONS[p.name]}</div>`:""}</div><button class="save" onclick='selectSearchResult(${JSON.stringify(p.name)})'>Añadir</button></div>`).join(""):`<div class="empty">No he encontrado una coincidencia en la base de datos de ${esc(state.destination)}. Prueba con “restaurante”, “café”, “playa”, “iglesia”, “romántico” o el nombre de un lugar.</div>`;
}
function selectSearchResult(name){
let p=getPlaces(state.destination).find(x=>x.name===name)||(VACAY_BUSINESSES[state.destination]||[]).find(x=>x.name===name);
if(p){let arr=JSON.parse(localStorage.getItem("vacaySearchSaved")||"[]");if(!arr.some(x=>x.name===name&&x.destination===state.destination))arr.push({destination:state.destination,...p});localStorage.setItem("vacaySearchSaved",JSON.stringify(arr));alert(name+" añadido a tu viaje ✦");}
}
function buildDetailedRoute(){
let start=document.getElementById("startTime")?.value||"09:00";
let route=DETAILED_ROUTES[state.destination];
let foods=VACAY_BUSINESSES[state.destination]||[];
if(route && foods.length){
  route=route.map((p,i)=>{
    if(/almuerzo|cena/i.test(p.type) && foods[i%foods.length]) return {...p,name:foods[i%foods.length].name,visit:(p.visit||"")+" · "+foods[i%foods.length].address};
    return p;
  });
}
let box=document.getElementById("detailedRoute"); if(!box||!route)return;
let cur=mins(start), out="";
route.forEach((p,i)=>{
if(i>0){let transfer=10;cur+=transfer;out+=`<div class="route-step"><div class="route-time">${hh(cur)}</div><div class="route-main"><span class="transfer">🚶 ~${transfer} min desde el punto anterior</span></div></div>`}
out+=`<div class="route-step"><div class="route-time">${hh(cur)}</div><div class="route-main"><h4>${esc(p.name)}</h4><div class="transfer">${esc(p.type)} · ${p.duration} min</div><p>${esc(p.visit)}</p></div></div>`;
cur+=p.duration;
});
box.innerHTML=`<div class="notice"><b>Ruta de ${esc(state.destination)}</b> · salida ${esc(start)} · duración estimada ${Math.round((cur-mins(start))/60*10)/10} h.</div>${out}<div class="notice">Los tiempos de desplazamiento son orientativos. En la siguiente fase podemos conectarlos a rutas reales a pie, transporte público, coche o barco.</div>`;
box.scrollIntoView({behavior:"smooth",block:"start"});
}
function mapsNearbyUrl(lat,lon,query){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(query)+"&center="+encodeURIComponent(lat+","+lon);}
function findNextFromLocation(){
let card=document.getElementById("nowCard");if(!card)return;
if(!window.isSecureContext||!navigator.geolocation){card.classList.add("show");card.innerHTML="<b>La ubicación necesita una conexión segura.</b><p>Abre vacay desde su URL HTTPS y permite la ubicación cuando el navegador la solicite.</p>";return;}
card.classList.add("show");card.innerHTML="<b>Buscando qué tienes cerca…</b><p>Solo usamos tu ubicación después de que tú des permiso.</p>";
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude,lon=pos.coords.longitude;
let places=(getPlaces(state.destination)||[]).concat(DETAILED_ROUTES[state.destination]||[]).filter(p=>p&&p.name);
let geo=places.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon)));
if(geo.length){
function dist(a,b,c,d){let R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;let q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
let p=geo.map(p=>({...p,km:dist(lat,lon,p.lat,p.lon)})).sort((a,b)=>a.km-b.km)[0];
let q=state.interests.length?state.interests.join(" "):"sitios para visitar";
card.innerHTML=`<b>Ahora mismo, cerca de ti</b><p><strong>${esc(p.name)}</strong><br>${esc(p.type||"Punto de interés")} · aproximadamente ${p.km<1?(Math.round(p.km*1000)+" m"):(p.km.toFixed(1)+" km")}.</p><div class="nearby-actions"><a class="primary" href="${mapsNearbyUrl(lat,lon,p.name)}" target="_blank" rel="noopener">Ir hacia allí ↗</a><a class="locate" href="${mapsNearbyUrl(lat,lon,q)}" target="_blank" rel="noopener">Buscar algo que me apetezca ↗</a></div>`;
}else{
let q=state.interests.length?state.interests.join(" "):"lugares para visitar";
card.innerHTML=`<b>Estoy contigo.</b><p>Este destino todavía no tiene coordenadas suficientes en la base local para ordenar los sitios por distancia. Te llevo directamente a una búsqueda cercana según tus intereses.</p><div class="nearby-actions"><a class="primary" href="${mapsNearbyUrl(lat,lon,q)}" target="_blank" rel="noopener">Buscar ${esc(q)} cerca ↗</a></div>`;
}
},err=>{let msg=err.code===1?"Has bloqueado la ubicación. Puedes activarla en los permisos del navegador.":"No he podido obtener tu posición ahora mismo. Prueba de nuevo en unos segundos.";card.innerHTML="<b>No he podido usar tu ubicación.</b><p>"+msg+"</p>";},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
function addFoodToPlan(name){
let foods=VACAY_BUSINESSES[state.destination]||[],f=foods.find(x=>x.name===name);if(!f)return;
let saved=JSON.parse(localStorage.getItem("vacayFoods")||"[]");
if(!saved.some(x=>x.name===f.name&&x.destination===state.destination))saved.push({destination:state.destination,...f});
localStorage.setItem("vacayFoods",JSON.stringify(saved));alert(f.name+" añadido a tu viaje ✦");
}
function addPlaceToPlan(i){
let p=getPlaces(state.destination)[i];if(!p)return;
let saved=JSON.parse(localStorage.getItem("vacayPlaces")||"[]");
if(!saved.some(x=>x.name===p.name&&x.destination===state.destination))saved.push({destination:state.destination,...p});
localStorage.setItem("vacayPlaces",JSON.stringify(saved));alert(p.name+" añadido a tu viaje ✦");
}
function select(label,key,vals,val){
return `<div class="field">${label?`<label>${label}</label>`:""}<select onchange='state[${JSON.stringify(key)}]=this.value'>${vals.map(v=>`<option ${String(v)===String(val)?"selected":""}>${esc(v)}</option>`).join("")}</select></div>`
}
function toggleInterest(x){state.interests=state.interests.includes(x)?state.interests.filter(a=>a!==x):[...state.interests,x];renderDestination()}
function scorePlace(p){
let text=(p.name+" "+(p.type||"")+" "+(p.description||"")+" "+(p.why||"")+" "+(p.tag||"")).toLowerCase(),score=0;
state.interests.map(x=>x.toLowerCase()).forEach(t=>{if(text.includes(t))score+=6});
if(state.mood==="Romántico"&&/románt|pareja|sunset|atardecer|rooftop|barco/.test(text))score+=5;
if(state.mood==="Playa"&&/playa|mar|costa|beach/.test(text))score+=6;
if(state.mood==="Gastronomía"&&/gastronom|restaurante|comida|café|mercado/.test(text))score+=6;
if(state.mood==="Cultura"&&/cultura|monumento|museo|historia|iglesia|arquitectura/.test(text))score+=6;
if(state.mood==="Aventura"&&/aventura|naturaleza|sender|montaña|barco/.test(text))score+=6;
if(state.mood==="Sin prisas"&&/paseo|parque|playa|café|mirador|barrio/.test(text))score+=3;
if(state.company==="Pareja"&&/románt|atardecer|barco|rooftop/.test(text))score+=2;
if(state.needs==="Pocas escaleras"&&/escalera|stairs|subida|montaña/.test(text))score-=5;
return score;
}
function pickPlacesForPlan(){
let all=[...(getPlaces(state.destination)||[])],seen=new Set(all.map(p=>p.name));
(DETAILED_ROUTES[state.destination]||[]).forEach(p=>{if(!seen.has(p.name)){all.push(p);seen.add(p.name)}});
return all.filter(p=>p.name&&!/restaurante|cafetería|café|bar de tapas|comida|heladería|dulce/i.test(p.type||"")).sort((a,b)=>scorePlace(b)-scorePlace(a));
}
function makeTimeLabel(m){return hh(m)}
function buildItinerary(){
state.startTime=document.getElementById("startTime")?.value||state.startTime;state.endTime=document.getElementById("endTime")?.value||state.endTime;state.lunchTime=document.getElementById("lunchTime")?.value||state.lunchTime;state.dinnerTime=document.getElementById("dinnerTime")?.value||state.dinnerTime;state.planNote=document.getElementById("planNote")?.value||state.planNote;
let n=Number(state.days)||3,start=mins(state.startTime),end=mins(state.endTime),lunch=mins(state.lunchTime),dinner=mins(state.dinnerTime);
if(end<=start)end+=1440;if(lunch<=start)lunch+=1440;if(dinner<=lunch)dinner+=1440;
let pool=pickPlacesForPlan(),foods=VACAY_BUSINESSES[state.destination]||[],attractionCount=state.pace==="Sin prisas"?2:state.pace==="Aprovecharlo todo"?4:3,cursor=0,days=[];
for(let i=1;i<=n;i++){
let selected=[];for(let k=0;k<attractionCount;k++){let p=pool[(cursor+k)%Math.max(pool.length,1)];if(p)selected.push(p)}cursor+=attractionCount;
let slots=[],t=start;
selected.slice(0,2).forEach((p,idx)=>{slots.push({time:makeTimeLabel(t),title:p.name,desc:(p.description||p.why||"Parada seleccionada para ti.")+" · "+(idx===0?"inicio del día":"continuación del recorrido"),type:"place",place:p});t+=state.pace==="Sin prisas"?70:60;t+=state.needs==="Minimizar desplazamientos"?8:15;});
if(t<lunch-35)t=lunch-75;
let lunchFood=foods.find(f=>/restaurante|comida|taberna/i.test(f.type||"")&&/€/.test(f.price||""))||foods.find(f=>/restaurante|comida|taberna/i.test(f.type||""));
slots.push({time:makeTimeLabel(lunch-10),title:lunchFood?lunchFood.name:"Pausa para comer",desc:lunchFood?("Comida propuesta según tu perfil · "+lunchFood.price+" · "+lunchFood.hours):"Momento reservado para comer según el horario que has elegido.",type:"food",food:lunchFood});
t=lunch+75;
selected.slice(2).forEach(p=>{if(t+50<dinner-30){slots.push({time:makeTimeLabel(t),title:p.name,desc:(p.description||p.why||"Experiencia seleccionada para ti.")+(state.needs==="Pocas escaleras"?" Se prioriza un recorrido sencillo.":""),type:"place",place:p});t+=state.pace==="Sin prisas"?75:65;t+=state.needs==="Minimizar desplazamientos"?8:15;}});
let dinnerFood=foods.find(f=>/restaurante|taberna/i.test(f.type||"")&&/cena|romántico|rooftop/i.test(f.tag||""))||foods.find(f=>/restaurante|taberna/i.test(f.type||""));
slots.push({time:makeTimeLabel(dinner),title:dinnerFood?dinnerFood.name:"Cena en "+state.destination,desc:dinnerFood?("Cena propuesta por vacay · "+dinnerFood.price+" · "+dinnerFood.hours):"Cena reservada a la hora que has elegido.",type:"food",food:dinnerFood});
slots.push({time:makeTimeLabel(Math.max(dinner+75,end-30)),title:"Fin del día",desc:state.pace==="Sin prisas"?"Queda tiempo libre para descansar o improvisar.":"Fin de la ruta planificada.",type:"end"});
days.push(slots);
}
let why=`Has elegido ${state.mood.toLowerCase()}, ritmo ${state.pace.toLowerCase()}, ${state.company.toLowerCase()}, presupuesto ${state.budget.toLowerCase()} y ${state.needs.toLowerCase()}.`;if(state.planNote)why+=` También he tenido en cuenta: “${esc(state.planNote)}”.`;
let html=`<div class="panel"><div class="profile-result"><div><div class="eyebrow">Tu perfil vacay</div><h2>Este viaje está hecho para ti.</h2><p class="lead" style="font-size:16px">${why}</p></div><div class="profile-chips"><span>${esc(state.days)} días</span><span>${esc(state.startTime)} → ${esc(state.endTime)}</span><span>Comida ${esc(state.lunchTime)}</span><span>Cena ${esc(state.dinnerTime)}</span></div></div><div class="notice"><b>Qué cambia aquí:</b> vacay reparte lugares de la base según tus intereses y ritmo, reserva tus horas de comida y cena y deja margen según la forma en la que quieres viajar.</div><div class="itinerary" style="margin-top:18px">`;
days.forEach((day,i)=>{let key=state.destination+"-"+(i+1)+"-"+Date.now();html+=`<article class="day"><div class="daytop"><h3>Día ${i+1}</h3><button class="save" onclick='saveDay(${JSON.stringify(key)},${JSON.stringify(day)})'>♡ Guardar</button></div>${day.map(s=>`<div class="slot"><div class="time">${esc(s.time)}</div><div><h4>${esc(s.title)}</h4><p>${esc(s.desc)}</p>${s.type==="place"&&s.place?.tag?`<span class="route-tag">${esc(s.place.tag)}</span>`:s.type==="food"&&s.food?`<span class="route-tag">Ficha comercial</span>`:s.type==="end"?`<span class="route-tag">Tiempo libre</span>`:""}</div></div>`).join("")}</article>`});html+=`</div></div>`;document.getElementById("route").innerHTML=html;document.getElementById("route").scrollIntoView({behavior:"smooth"});
}
function saveDay(key,day){
let saved=JSON.parse(localStorage.getItem("vacaySaved")||"[]");
if(!saved.some(x=>x.key===key))saved.push({key,destination:state.destination,day});
localStorage.setItem("vacaySaved",JSON.stringify(saved));updateCount();alert("Guardado en Mi viaje ✦");
}
function showSaved(){
let saved=JSON.parse(localStorage.getItem("vacaySaved")||"[]");
let content=saved.length?saved.map((x,i)=>`<article class="day"><div class="daytop"><h3>${esc(x.destination)} · Día ${i+1}</h3><button class="save" onclick='removeSaved(${JSON.stringify(x.key)})'>Quitar</button></div>${x.day.map(s=>`<div class="slot"><div class="time">${s.time}</div><div><h4>${esc(s.title)}</h4><p>${esc(s.desc)}</p></div></div>`).join("")}</article>`).join(""):`<div class="empty">Todavía no has guardado ningún día. Crea un itinerario y pulsa “♡ Guardar”.</div>`;
shell(`<div class="back"><button onclick="home()">← Volver a Europa</button></div><section class="hero" style="margin-top:10px"><div class="eyebrow">Tu viaje</div><h1>Mi viaje.</h1><p class="lead">Aquí se guardan los días que quieras conservar.</p></section><div class="itinerary">${content}</div>`);
}
function removeSaved(k){let s=JSON.parse(localStorage.getItem("vacaySaved")||"[]").filter(x=>x.key!==k);localStorage.setItem("vacaySaved",JSON.stringify(s));showSaved()}
home();
</script></body></html>
