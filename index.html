<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vacay — Tu viaje, a tu manera</title>
<style>
:root{--cream:#f5f1e8;--paper:#fffdf8;--ink:#17352d;--muted:#68736d;--line:#d9d6cc;--sage:#dce6dc}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:24px 28px 70px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.logo{font-size:28px;font-weight:800;letter-spacing:-1px}.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;color:var(--ink)}
.hero{padding:55px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px}h1,h2,h3{font-family:Georgia,serif;font-weight:500;letter-spacing:-1px}h1{font-size:clamp(50px,8vw,88px);line-height:.94;margin:0 0 22px}h2{font-size:36px;margin:0 0 18px}.lead{font-size:19px;line-height:1.5;color:#58645e;max-width:680px}
.maphero{display:grid;grid-template-columns:40% 60%;min-height:610px;margin:0 -28px 55px;border-block:1px solid var(--line)}.mapcopy{padding:55px 48px;display:flex;flex-direction:column;justify-content:center}.mapbox{padding:25px 25px 25px 0;display:flex;align-items:center}.mapframe{position:relative;width:100%;aspect-ratio:960/830;border-radius:28px;overflow:hidden;background:#dceff1;border:1px solid var(--line);box-shadow:0 20px 45px #17352d18}.mapframe img{width:100%;height:100%;object-fit:contain;display:block}.pin{position:absolute;width:22px;height:22px;border:0;background:transparent;transform:translate(-50%,-50%)}.pin:after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--ink);border:3px solid white;box-shadow:0 3px 10px #17352d44}.pin:hover:after{transform:scale(1.25)}
.primary{border:0;background:var(--ink);color:white;padding:14px 21px;border-radius:999px;font-weight:700}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:25px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:21px}.card button{border:0;background:none;text-align:left;width:100%;color:var(--ink)}.name{font-family:Georgia,serif;font-size:25px}.muted{color:var(--muted);font-size:13px;margin-top:7px}.back{margin:10px 0 25px}.back button{border:0;background:none;color:var(--muted);padding:0}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;color:var(--ink)}.choice.active{background:var(--ink);color:white}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.wide{width:100%;margin-top:20px}.results{display:grid;gap:9px;margin-top:14px}.result{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.itinerary{display:grid;gap:12px}.day{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}.daytop{display:flex;justify-content:space-between;align-items:center}.day h3{font-size:27px;margin:0}.save{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px}.slot{display:grid;grid-template-columns:75px 1fr;gap:15px;padding:15px 0;border-top:1px solid var(--line);margin-top:14px}.slot h4{margin:0 0 5px}.slot p{margin:0;color:var(--muted);line-height:1.4}.notice{background:var(--sage);border-radius:15px;padding:14px;margin-top:14px;color:#355044}.empty{color:var(--muted);padding:25px 0}
@media(max-width:800px){.wrap{padding:18px 16px 50px}.maphero{grid-template-columns:1fr;margin:0 -16px 35px}.mapcopy{padding:40px 22px 25px}.mapbox{padding:0 16px 20px}.fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const countries={
"España":["Madrid","Barcelona","Sevilla","Granada","San Sebastián","Mallorca","Ibiza","Tenerife"],
"Portugal":["Lisboa","Oporto","Sintra","Algarve","Madeira","Azores"],
"Francia":["París","Niza","Provenza","Lyon","Burdeos","Estrasburgo","Córcega"],
"Italia":["Roma","Venecia","Florencia","Positano","Capri","Milán","Lago di Como","Cinque Terre","Puglia","Sicilia","Cerdeña","Dolomitas"],
"Grecia":["Atenas","Santorini","Mykonos","Creta","Corfú","Rodas","Milos"],
"Reino Unido":["Londres","Edimburgo","Bath","York","Cotswolds","Isla de Skye"],
"Irlanda":["Dublín","Galway","Cork","Killarney","Acantilados de Moher"],
"Islandia":["Reikiavik","Círculo Dorado","Costa Sur","Vík","Akureyri"],
"Noruega":["Oslo","Bergen","Geiranger","Lofoten","Tromsø"],
"Suecia":["Estocolmo","Gotemburgo","Malmö","Laponia sueca"],
"Finlandia":["Helsinki","Rovaniemi","Laponia","Turku"],
"Dinamarca":["Copenhague","Aarhus","Odense"],
"Países Bajos":["Ámsterdam","Róterdam","Utrecht","La Haya","Giethoorn"],
"Bélgica":["Bruselas","Brujas","Gante","Amberes"],
"Alemania":["Berlín","Múnich","Hamburgo","Colonia","Dresde","Selva Negra"],
"Suiza":["Zúrich","Lucerna","Interlaken","Zermatt","Berna","Lauterbrunnen"],
"Austria":["Viena","Salzburgo","Innsbruck","Hallstatt"],
"Chequia":["Praga","Český Krumlov","Brno"],
"Polonia":["Cracovia","Varsovia","Gdansk","Wroclaw","Zakopane"],
"Hungría":["Budapest","Lago Balaton"],
"Croacia":["Dubrovnik","Split","Hvar","Zadar","Rovinj","Plitvice"],
"Montenegro":["Kotor","Budva","Durmitor"],
"Albania":["Tirana","Berat","Gjirokastër","Riviera Albanesa"],
"Malta":["La Valeta","Mdina","Gozo","Comino"],
"Turquía":["Estambul","Capadocia","Antalya","Éfeso","Bodrum"],
"Ucrania":["Kyiv","Leópolis","Odesa"],
"Andorra":["Andorra la Vella","Grandvalira"],
"Liechtenstein":["Vaduz","Malbun"]
};
const pins=[["Reikiavik",14,17,"Islandia"],["Oslo",48,33,"Noruega"],["Estocolmo",59,36,"Suecia"],["Helsinki",70,31,"Finlandia"],["Copenhague",50,43,"Dinamarca"],["Dublín",21,46,"Irlanda"],["Londres",31,52,"Reino Unido"],["Ámsterdam",42,54,"Países Bajos"],["Berlín",55,56,"Alemania"],["Varsovia",67,57,"Polonia"],["París",33,63,"Francia"],["Praga",54,62,"Chequia"],["Zúrich",44,69,"Suiza"],["Viena",59,67,"Austria"],["Budapest",66,69,"Hungría"],["Milán",46,74,"Italia"],["Madrid",16,81,"España"],["Barcelona",29,81,"España"],["Lisboa",7,81,"Portugal"],["Roma",52,83,"Italia"],["Estambul",82,84,"Turquía"],["Atenas",71,92,"Grecia"]];
const moods=["Romántico","Playa","Gastronomía","Aventura","Sin prisas","Cultura"];
const interests=["Playa","Barco","Gastronomía","Cultura","Naturaleza","Atardecer"];
let state={country:"",destination:"",days:3,start:"09:00",end:"22:00",pace:"Equilibrado",company:"Pareja",budget:"Medio",mood:"Sin prisas",interests:["Gastronomía","Atardecer"],avoid:[],style:"Mezcla"};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shell(c){document.getElementById("app").innerHTML='<div class="wrap"><nav><div class="logo">vacay</div><div><button class="pill" onclick="home()">Europa</button> <button class="pill" onclick="saved()">Mi viaje <span id="count"></span></button></div></nav>'+c+'</div>';updateCount()}
function updateCount(){let a=JSON.parse(localStorage.getItem("vacaySaved")||"[]");let e=document.getElementById("count");if(e)e.textContent=a.length?" ("+a.length+")":""}
function home(){
let p=pins.map(x=>'<button class="pin" title="'+esc(x[0])+'" style="left:'+x[1]+'%;top:'+x[2]+'%" onclick=\'goCountry("'+x[3]+'")\'></button>').join("");
let cards=Object.entries(countries).map(([c,d])=>'<div class="card"><button onclick=\'goCountry("'+c+'")\'><div class="name">'+esc(c)+'</div><div class="muted">'+d.length+' destinos · explorar</div></button></div>').join("");
shell('<section class="maphero"><div class="mapcopy"><div class="eyebrow">Tu próximo destino te espera</div><h1>Europa,<br>a tu manera.</h1><p class="lead">vacay crea viajes personalizados según cómo quieres viajar, no solo según dónde quieres ir.</p><button class="primary" onclick="document.getElementById(\'countries\').scrollIntoView({behavior:\'smooth\'})">Explora Europa →</button><div style="margin-top:35px;font-family:cursive;font-size:25px;transform:rotate(-3deg)">Good places<br>good people ♡</div></div><div class="mapbox"><div class="mapframe"><img src="mapa-europa.png" alt="Mapa de Europa">'+p+'</div></div></section><section class="panel"><h2>Tu viaje empieza contigo.</h2><p class="lead">Elige un destino, cuéntanos tu ritmo, compañía, presupuesto e intereses y vacay construye una ruta pensada para ti.</p></section><div id="countries"><div class="eyebrow">Europa · '+Object.keys(countries).length+' países · '+Object.values(countries).flat().length+' destinos</div><h2>Elige un país</h2><div class="grid">'+cards+'</div></div>');
}
function goCountry(c){state.country=c;let cards=countries[c].map(d=>'<div class="card"><button onclick=\'destination("'+c+'","'+d+'")\'><div class="name">'+esc(d)+'</div><div class="muted">Construye tu viaje →</div></button></div>').join("");shell('<div class="back"><button onclick="home()">← Volver a Europa</button></div><div class="hero"><div class="eyebrow">Explora '+esc(c)+'</div><h1>'+esc(c)+'<br>a tu manera.</h1><p class="lead">Selecciona un destino para crear tu perfil de viaje.</p></div><h2>Destinos</h2><div class="grid">'+cards+'</div>')}
function destination(c,d){state={...state,country:c,destination:d};render()}
function render(){
let mood=moods.map(x=>'<button class="choice '+(state.mood===x?"active":"")+'" onclick=\'state.mood="'+x+'";render()\'> '+x+' </button>').join("");
let ints=interests.map(x=>'<button class="choice '+(state.interests.includes(x)?"active":"")+'" onclick=\'toggleInterest("'+x+'")\'> '+x+' </button>').join("");
let avoids=["Muchas caminatas","Muchas escaleras","Turismo masificado","Madrugar"].map(x=>'<button class="choice '+(state.avoid.includes(x)?"active":"")+'" onclick=\'toggleAvoid("'+x+'")\'> '+x+' </button>').join("");
let styles=["Imprescindibles","Sitios locales","Mezcla","Mucho tiempo libre"].map(x=>'<button class="choice '+(state.style===x?"active":"")+'" onclick=\'chooseStyle("'+x+'")\'> '+x+' </button>').join("");
let timeOptions="";
for(let h=0;h<24;h++)for(let m of [0,30]){let t=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");timeOptions+='<option value="'+t+'">'+t+'</option>'}
let examples={Positano:["Paseo por el centro y miradores","Playa y costa","Cena italiana con vistas"],Roma:["Coliseo y centro histórico","Pasta romana","Trastevere al atardecer"],París:["Barrio emblemático","Bistró francés","Paseo nocturno"],Barcelona:["Casco histórico","Tapas y gastronomía","Arquitectura y mar"]};
let ex=(examples[state.destination]||["Descubrir los lugares más representativos","Comer como local","Tarde a tu ritmo","Atardecer y cena"]).map((x,i)=>'<div class="card"><div class="eyebrow">'+(i===0?"Mañana":i===1?"Mediodía":i===2?"Tarde":"Noche")+'</div><div class="name">'+esc(x)+'</div><p class="muted">Experiencia adaptable a tu perfil.</p></div>').join("");
shell('<div class="back"><button onclick=\'goCountry("'+state.country+'")\'>← Volver a '+esc(state.country)+'</button></div><section class="hero" style="padding-bottom:30px"><div class="eyebrow">'+esc(state.country)+' · tu viaje</div><h1>'+esc(state.destination)+',<br>a tu manera.</h1><p class="lead">Dime cómo quieres vivirlo y vacay adaptará las recomendaciones.</p></section><div class="panel"><h2>1. ¿Qué viaje quieres vivir?</h2><div class="choices">'+mood+'</div></div><div class="panel"><h2>2. Cuéntame cómo viajas</h2><div class="fields"><div class="field"><label>Días</label><select onchange="state.days=this.value;render()"><option value="1" '+(Number(state.days)===1?"selected":"")+'>1</option><option value="2" '+(Number(state.days)===2?"selected":"")+'>2</option><option value="3" '+(Number(state.days)===3?"selected":"")+'>3</option><option value="4" '+(Number(state.days)===4?"selected":"")+'>4</option><option value="5" '+(Number(state.days)===5?"selected":"")+'>5</option><option value="6" '+(Number(state.days)===6?"selected":"")+'>6</option><option value="7" '+(Number(state.days)===7?"selected":"")+'>7</option></select></div><div class="field"><label>Empiezas</label><select onchange="state.start=this.value;render()">'+timeOptions.replace('value="'+state.start+'"','value="'+state.start+'" selected')+'</select></div><div class="field"><label>Terminas</label><select onchange="state.end=this.value;render()">'+timeOptions.replace('value="'+state.end+'"','value="'+state.end+'" selected')+'</select></div><div class="field"><label>Ritmo</label><select onchange="state.pace=this.value;render()"><option '+(state.pace==="Sin prisas"?"selected":"")+'>Sin prisas</option><option '+(state.pace==="Equilibrado"?"selected":"")+'>Equilibrado</option><option '+(state.pace==="Aprovecharlo todo"?"selected":"")+'>Aprovecharlo todo</option></select></div><div class="field"><label>Con quién</label><select onchange="state.company=this.value;render()"><option '+(state.company==="Pareja"?"selected":"")+'>Pareja</option><option '+(state.company==="Amigos"?"selected":"")+'>Amigos</option><option '+(state.company==="Familia"?"selected":"")+'>Familia</option><option '+(state.company==="Solo"?"selected":"")+'>Solo</option></select></div><div class="field"><label>Presupuesto</label><select onchange="state.budget=this.value;render()"><option '+(state.budget==="Ajustado"?"selected":"")+'>Ajustado</option><option '+(state.budget==="Medio"?"selected":"")+'>Medio</option><option '+(state.budget==="Flexible"?"selected":"")+'>Flexible</option></select></div></div><div style="margin-top:22px"><div class="eyebrow">Intereses · puedes elegir varios</div><div class="choices">'+ints+'</div></div><div style="margin-top:22px"><div class="eyebrow">¿Qué prefieres evitar? · puedes elegir varios</div><div class="choices">'+avoids+'</div></div><div style="margin-top:22px"><div class="eyebrow">¿Cómo quieres descubrir el destino? · puedes elegir varias</div><div class="choices">'+styles+'</div></div><button class="primary wide" onclick="build()">Crear mi itinerario ✦</button></div><div class="panel"><h2>Experiencias que encajan</h2><div class="grid">'+ex+'</div></div><div class="panel"><h2>⌖ Estoy aquí</h2><p class="lead" style="font-size:16px">Función preparada para usar tu ubicación en HTTPS y mostrarte el punto de interés más cercano.</p><button class="primary" onclick="locate()">Usar mi ubicación</button><div id="loc"></div></div><div id="route"></div>');
}function toggleInterest(x){state.interests=state.interests.includes(x)?state.interests.filter(a=>a!==x):state.interests.concat(x);render()} function toggleAvoid(x){state.avoid=state.avoid.includes(x)?state.avoid.filter(a=>a!==x):state.avoid.concat(x);render()} function chooseStyle(x){state.style=x;render()}
function build(){
let n=Number(state.days)||3;
const pools={
"Roma":[
["Coliseo y centro histórico",["Cultura"],["Imprescindibles"],"Centro"],
["Foro Romano y Palatino",["Cultura","Naturaleza"],["Imprescindibles"],"Centro"],
["Pasta romana en Trastevere",["Gastronomía"],["Sitios locales","Mezcla"],"Trastevere"],
["Trastevere al atardecer",["Atardecer","Cultura"],["Sitios locales","Mezcla"],"Trastevere"],
["Villa Borghese",["Naturaleza"],["Sitios locales","Mezcla"],"Centro"],
["Fontana di Trevi de noche",["Cultura","Atardecer"],["Imprescindibles","Mezcla"],"Centro"],
["Cena romana",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"]
],
"Positano":[
["Centro de Positano y miradores",["Cultura","Atardecer"],["Imprescindibles","Mezcla"],"Centro"],
["Spiaggia Grande",["Playa"],["Imprescindibles","Mezcla"],"Costa"],
["Fornillo y paseo de costa",["Playa","Naturaleza"],["Sitios locales","Mezcla"],"Costa"],
["Paseo en barco por la Costa Amalfitana",["Barco","Naturaleza"],["Imprescindibles","Mezcla"],"Costa"],
["Atardecer en un mirador",["Atardecer"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Comida italiana",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Cena con vistas",["Gastronomía","Atardecer"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"]
],
"París":[
["Torre Eiffel y Trocadéro",["Cultura","Atardecer"],["Imprescindibles","Mezcla"],"Centro"],
["Louvre",["Cultura"],["Imprescindibles"],"Centro"],
["Le Marais",["Cultura","Gastronomía"],["Sitios locales","Mezcla"],"Marais"],
["Montmartre",["Cultura","Atardecer"],["Imprescindibles","Sitios locales","Mezcla"],"Montmartre"],
["Paseo por el Sena",["Naturaleza","Atardecer"],["Sitios locales","Mezcla"],"Centro"],
["Bistró francés",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Cena + luces",["Gastronomía","Atardecer"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"]
],
"Barcelona":[
["Barrio Gótico",["Cultura"],["Imprescindibles","Mezcla"],"Centro"],
["Sagrada Família",["Cultura"],["Imprescindibles"],"Centro"],
["El Born",["Cultura","Gastronomía"],["Sitios locales","Mezcla"],"Centro"],
["Park Güell",["Naturaleza","Cultura"],["Imprescindibles","Mezcla"],"Gràcia"],
["Barceloneta",["Playa","Naturaleza"],["Imprescindibles","Mezcla"],"Mar"],
["Tapas y gastronomía",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Atardecer frente al mar",["Atardecer","Playa"],["Imprescindibles","Sitios locales","Mezcla"],"Mar"]
]
};
let fallback=[
["Descubrir el centro histórico",["Cultura"],["Imprescindibles","Mezcla"],"Centro"],
["Barrio con ambiente local",["Cultura","Gastronomía"],["Sitios locales","Mezcla"],"Centro"],
["Comer como local",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Paseo por la naturaleza",["Naturaleza"],["Sitios locales","Mezcla"],"Exterior"],
["Lugar para el atardecer",["Atardecer"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"],
["Experiencia de ocio",["Aventura"],["Sitios locales","Mezcla"],"Centro"],
["Cena local",["Gastronomía"],["Imprescindibles","Sitios locales","Mezcla"],"Centro"]
];
let pool=pools[state.destination]||fallback;
let score=item=>{
let s=0;
state.interests.forEach(i=>{if(item[1].includes(i))s+=5});
if(item[2].includes(state.style))s+=3;
if(state.mood==="Gastronomía"&&item[1].includes("Gastronomía"))s+=3;
if(state.mood==="Playa"&&item[1].includes("Playa"))s+=3;
if(state.mood==="Cultura"&&item[1].includes("Cultura"))s+=3;
if(state.mood==="Aventura"&&(item[1].includes("Barco")||item[1].includes("Naturaleza")))s+=3;
if(state.mood==="Romántico"&&item[1].includes("Atardecer"))s+=3;
if(state.mood==="Sin prisas"&&item[1].includes("Naturaleza"))s+=2;
if(state.avoid.includes("Muchas caminatas")&&item[3]==="Centro")s+=1;
return s;
};
let ranked=pool.map((x,i)=>({x,i,s:score(x)})).sort((a,b)=>b.s-a.s||a.i-b.i);
if(state.style==="Imprescindibles")ranked.sort((a,b)=>(b.x[2].includes("Imprescindibles")?1:0)-(a.x[2].includes("Imprescindibles")?1:0)||b.s-a.s);
if(state.style==="Sitios locales")ranked.sort((a,b)=>(b.x[2].includes("Sitios locales")?1:0)-(a.x[2].includes("Sitios locales")?1:0)||b.s-a.s);
let selected=ranked.slice(0,4).map(r=>r.x);
if(state.style==="Mucho tiempo libre")selected=ranked.slice(0,3).map(r=>r.x);
if(state.avoid.includes("Muchas caminatas"))selected=selected.filter(x=>x[3]!=="Exterior"||selected.length<=2);
if(state.avoid.includes("Muchas escaleras"))selected=selected.filter(x=>!x[0].toLowerCase().includes("montmartre")&&!x[0].toLowerCase().includes("miradores"));
if(!selected.length)selected=ranked.slice(0,3).map(r=>r.x);
let start=state.start||"09:00",end=state.end||"22:00";
let toMin=t=>{let p=t.split(":").map(Number);return p[0]*60+p[1]};
let fmt=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
let a=toMin(start),b=toMin(end);if(b<=a)b+=24*60;
let slots=state.pace==="Sin prisas"?[0.08,0.40,0.72,0.9]:state.pace==="Aprovecharlo todo"?[0.02,0.27,0.52,0.76]:[0.05,0.34,0.63,0.86];
if(selected.length===3)slots=[slots[0],slots[1],slots[2]];
if(state.avoid.includes("Madrugar"))slots=slots.map((x,j)=>j===0?Math.max(x,0.15):x);
if(state.avoid.includes("Turismo masificado"))slots=slots.map((x,j)=>j<2?Math.min(x+0.06,0.92):x);
let days="";
for(let i=1;i<=n;i++){
days+='<article class="day"><div class="daytop"><h3>Día '+i+'</h3><button class="save" onclick="saveDay('+i+')">♡ Guardar</button></div>'+selected.map((item,j)=>{let tm=Math.round(a+(b-a)*slots[Math.min(j,slots.length-1)]);let note=state.pace==="Sin prisas"?"Ruta con margen para parar y disfrutar.":state.pace==="Aprovecharlo todo"?"Ritmo más intenso para aprovechar el día.":"Ruta equilibrada según tus preferencias.";if(item[1].includes("Gastronomía"))note+=" Incluido por tu interés en gastronomía.";if(item[1].includes("Atardecer"))note+=" Elegido para encajar con tu interés por el atardecer.";if(item[1].includes("Playa"))note+=" Incluido por tu interés en playa.";if(item[1].includes("Barco"))note+=" Incluido por tu interés en barco.";if(item[1].includes("Naturaleza"))note+=" Incluido por tu interés en naturaleza.";if(state.avoid.includes("Muchas caminatas"))note+=" Se priorizan zonas con menos desplazamientos.";if(state.avoid.includes("Turismo masificado"))note+=" Se priorizan alternativas menos orientadas al turismo masificado.";if(state.style==="Mucho tiempo libre")note+=" Se deja más tiempo libre alrededor de esta experiencia.";return '<div class="slot"><div><b>'+fmt(tm)+'</b></div><div><h4>'+esc(item[0])+'</h4><p>'+esc(note)+'</p></div></div>'}).join("")+'</article>';
}
document.getElementById("route").innerHTML='<div class="panel"><h2>Tu itinerario personalizado</h2><div class="notice"><b>Así hemos usado tus respuestas:</b> '+esc(state.mood)+', '+esc(state.pace)+', '+esc(state.company)+', presupuesto '+esc(state.budget)+'. Intereses: '+esc(state.interests.join(", "))+'.'+(state.avoid.length?" Evitas: "+esc(state.avoid.join(", "))+'.':"")+' Estilo: '+esc(state.style)+'.</div><div class="itinerary" style="margin-top:15px">'+days+'</div></div>';document.getElementById("route").scrollIntoView({behavior:"smooth"})
}
function saveDay(i){let a=JSON.parse(localStorage.getItem("vacaySaved")||"[]");let k=state.destination+"-"+i;if(!a.some(x=>x.key===k))a.push({key:k,destination:state.destination,day:i});localStorage.setItem("vacaySaved",JSON.stringify(a));updateCount();alert("Día guardado en Mi viaje ✦")}
function saved(){let a=JSON.parse(localStorage.getItem("vacaySaved")||"[]");shell('<div class="back"><button onclick="home()">← Volver a Europa</button></div><section class="hero"><div class="eyebrow">Tu viaje</div><h1>Mi viaje.</h1><p class="lead">Aquí guardas los días que quieres conservar.</p></section>'+(a.length?a.map(x=>'<div class="panel"><h2>'+esc(x.destination)+' · Día '+x.day+'</h2><p class="muted">Guardado en tu viaje ✦</p></div>').join(""):'<div class="empty">Todavía no has guardado ningún día.</div>'))}
function locate(){let e=document.getElementById("loc");if(!e)return;if(!navigator.geolocation){e.innerHTML='<div class="notice">Tu navegador no permite geolocalización.</div>';return}e.innerHTML='<div class="notice"><b>Buscando tu ubicación…</b><br>Permite el acceso cuando el navegador lo solicite.</div>';navigator.geolocation.getCurrentPosition(()=>{e.innerHTML='<div class="notice"><b>¡Ubicación recibida!</b><br>La siguiente fase conectará tu posición con la base de lugares cercanos de '+esc(state.destination)+'.</div>'},()=>{e.innerHTML='<div class="notice"><b>No se pudo obtener la ubicación.</b><br>Comprueba el permiso del navegador.</div>'},{enableHighAccuracy:true,timeout:8000})}
home();
</script>
</body>
</html>
